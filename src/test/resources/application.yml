# 시험 전용 설정. 개인 .env를 읽지 않습니다(main의 application.yml 대신 이 파일이 쓰임).
# DB는 TestcontainersConfiguration이 시험마다 새 MySQL 9.7 컨테이너를 띄워 연결합니다(Docker 필요).
spring:
  application:
    name: smartrent
  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      # 표는 Flyway SQL(db/migration)로 만들고, JPA는 엔티티가 표와 맞는지만 검사합니다(개발·시험·운영 같음)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

smartrent:
  jwt:
    # 시험 전용 값. 실제 비밀값이 아닙니다
    secret: test-only-jwt-secret-not-for-real-use-0123456789
    access-minutes: 30
    refresh-days: 14
  storage:
    # 시험은 시험마다 만든 임시 폴더를 씀(StorageTestConfig). 1분 재시도는 시험이 직접 부름
    mode: local
    local-dir: build/test-uploads
    aws-region: ap-northeast-2
    retry-enabled: false
