# 값은 프로젝트 루트의 .env(또는 OS 환경변수)에서 읽습니다. 이름은 .env.example과 같습니다.
# .env는 properties 형식(이름=값)이고, 같은 이름의 OS 환경변수가 있으면 그쪽이 우선입니다.
spring:
  application:
    name: smartrent
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # 표는 Flyway SQL(db/migration)로 만들고, JPA는 엔티티가 표와 맞는지만 검사합니다(개발·시험·운영 같음)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

smartrent:
  jwt:
    # 32자 이상 임의 문자열(HS256). 개발용과 운영용을 다르게 씁니다
    secret: ${JWT_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  seed:
    # local 프로필은 항상 빈 표에 처음 데이터를 넣음. prod는 이 값이 true일 때만 기자재와 관리자 계정을 넣음(B1-03)
    prod-enabled: ${SEED_PROD_ENABLED:false}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

---
# 개발용(각자 컴퓨터)
spring:
  config:
    activate:
      on-profile: local

---
# AWS 서버(B1-25에서 채움)
spring:
  config:
    activate:
      on-profile: prod
