# 값은 프로젝트 루트의 .env(또는 OS 환경변수)에서 읽습니다. 이름은 .env.example과 같습니다.
# .env는 properties 형식(이름=값)이고, 같은 이름의 OS 환경변수가 있으면 그쪽이 우선입니다.
spring:
  application:
    name: smartrent
  config:
    import: "optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    # 인증 메일(Gmail SMTP, 외부 연결 1절). 앱 비밀번호는 .env에만
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  servlet:
    multipart:
      # 사진은 10MB까지(확정). 넘는 파일도 FILE_INVALID로 답하려고 받는 한도는 조금 크게 둠
      max-file-size: 11MB
      max-request-size: 12MB
  jpa:
    open-in-view: false
    hibernate:
      # 표는 Flyway SQL(db/migration)로 만들고, JPA는 엔티티가 표와 맞는지만 검사합니다(개발·시험·운영 같음)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

smartrent:
  mail:
    # false면 메일을 보내지 않음. local은 서버 로그에 인증번호를 찍고, prod는 MAIL_UNAVAILABLE로 답함
    enabled: ${MAIL_ENABLED:false}
  jwt:
    # 32자 이상 임의 문자열(HS256). 개발용과 운영용을 다르게 씁니다
    secret: ${JWT_SECRET:}
    access-minutes: ${JWT_ACCESS_MINUTES:30}
    refresh-days: ${JWT_REFRESH_DAYS:14}
  storage:
    # local: 레포 밖 폴더(STORAGE_LOCAL_DIR, 비우면 ~/smartrent-uploads), s3: 비공개 S3 버킷(외부 연결 5절)
    mode: ${STORAGE_MODE:local}
    local-dir: ${STORAGE_LOCAL_DIR:}
    s3-bucket: ${S3_BUCKET:}
    aws-region: ${AWS_REGION:ap-northeast-2}
  seed:
    # local 프로필은 항상 빈 표에 처음 데이터를 넣음. prod는 이 값이 true일 때만 기자재와 관리자 계정을 넣음(B1-03)
    prod-enabled: ${SEED_PROD_ENABLED:false}
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}

---
# 개발용(각자 컴퓨터)
spring:
  config:
    activate:
      on-profile: local

---
# AWS 서버(B1-25에서 채움)
spring:
  config:
    activate:
      on-profile: prod
