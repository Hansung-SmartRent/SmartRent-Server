      type: object
      properties:
        byStatus:
          type: object
          properties:
            RESERVED:
              type: integer
              format: int64
              example: 0
            RENTING:
              type: integer
              format: int64
              example: 0
            RETURNED:
              type: integer
              format: int64
              example: 0
            CANCELLED:
              type: integer
              format: int64
              example: 0
            NO_SHOW:
              type: integer
              format: int64
              example: 0
          description: 기간과 무관한 조회 시점의 전체 대여 상태별 수
        models:
          type: integer
          format: int64
          example: 40
