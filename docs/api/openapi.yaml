          - to
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
        counts:
          type: object
          required:
          - rentalCount
          - returnCount
          - noShowCount
          - lateCount
          properties:
            rentalCount:
              type: integer
              description: 기간 내 실제 수령한 대여 기록 수(추천)
              format: int64
              minimum: 0
              example: 0
            returnCount:
              type: integer
              description: 기간 내 반납 완료한 대여 기록 수(추천)
              format: int64
              minimum: 0
              example: 0
            noShowCount:
              type: integer
              description: 기간 내 유효 NO_SHOW 경고 수. 신청 단위, 취소된 경고 제외(추천)
              format: int64
              minimum: 0
              example: 0
            lateCount:
              type: integer
              description: 기간 내 유효 LATE 경고 수. 대여 단위, 취소된 경고 제외(추천)
              format: int64
              minimum: 0
              example: 0
        topModels:
          type: array
          description: 기간 내 실제 수령 건수 내림차순의 모델 목록(추천). 같은 건수면 modelId 오름차순, 수령 0건 모델은 제외. 최대 개수 제한 없이 반환.
          items:
            type: object
            required:
            - modelId
            - modelName
            - rentalCount
