# 이 파일은 API 주소·항목·자료형·오류의 기준입니다. 규칙 설명은 README.md에 있습니다.
openapi: 3.0.3
info:
  title: SmartRent API
  version: 0.1.0
  description: 한성대 기자재 대여 서비스 SmartRent의 서버 API 명세 초안입니다. 규칙 설명과 오류 코드 표는 docs/api/README.md, 상태 전이의 기준은 docs/db/README.md 7절입니다. 추천(미확정) 값은 각 문서에 표시되어 있습니다.
servers:
- url: http://localhost:8080/api/v1
  description: 개발 서버(옛 README에서 확정)
security:
- bearerAuth: []
tags:
- name: 인증
- name: 내 정보
- name: 기자재
- name: 대여
- name: 관리자 대여
- name: 관리자 학생
- name: 관리자 기자재
- name: 운영
- name: 알림
- name: AI 추천
- name: 공지·문의
- name: 통계·기록
paths:
  /auth/email-codes:
    post:
      tags:
      - 인증
      summary: 인증번호 보내기
      operationId: postAuthEmailCodes
      description: '6자리 인증번호를 메일로 보낸다. 5분 동안 유효하고, 다시 보내면 옛 번호는 못 쓴다(기획안 1장). SIGNUP은 가입되지 않은 학교 이메일, PASSWORD_RESET은 가입된 이메일, EMAIL_CHANGE는 로그인한 상태에서 새 학교 이메일로 보낸다.


        **담당:** 백엔드 1 · **권한:** 없음 · **이슈:** B1-05'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailCodeRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/EmailCodeSent'
        '400':
          description: 'VALIDATION_ERROR: 필수값 누락, 형식 오류. data에 칸별 오류 목록 / EMAIL_DOMAIN_NOT_ALLOWED: @ 뒤가 hansung.ac.kr·hansung.kr·hansung.edu와 정확히 같지 않음(기획안 1장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    message: 입력값을 확인해 주세요.
                    data: null
                    errorCode: VALIDATION_ERROR
                EMAIL_DOMAIN_NOT_ALLOWED:
                  value:
                    success: false
                    message: 학교 이메일만 사용할 수 있습니다.
                    data: null
                    errorCode: EMAIL_DOMAIN_NOT_ALLOWED
        '404':
          description: 'NOT_FOUND: 없는 id·코드'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOT_FOUND:
                  value:
                    success: false
                    message: 대상을 찾을 수 없습니다.
                    data: null
                    errorCode: NOT_FOUND
        '409':
          description: 'EMAIL_ALREADY_USED: 가입·이메일 변경'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_ALREADY_USED:
                  value:
                    success: false
                    message: 이미 가입된 이메일입니다.
                    data: null
                    errorCode: EMAIL_ALREADY_USED
        '503':
          description: 'MAIL_UNAVAILABLE: SMTP 실패(docs/외부연결.md). 보낸 인증번호는 무효'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MAIL_UNAVAILABLE:
                  value:
                    success: false
                    message: 메일을 보내지 못했습니다. 잠시 뒤 다시 시도해 주세요.
                    data: null
                    errorCode: MAIL_UNAVAILABLE
  /auth/signup:
    post:
      tags:
      - 인증
      summary: 회원가입
      operationId: postAuthSignup
      description: '이메일 인증번호가 맞으면 학생 계정을 만든다. approval은 NONE으로 시작하고 학생증을 제출해야 PENDING이 된다. 가입과 동시에 로그인 토큰을 준다(추천).


        **담당:** 백엔드 1 · **권한:** 없음 · **이슈:** B1-05'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthTokens'
        '400':
          description: 'VALIDATION_ERROR: 필수값 누락, 형식 오류. data에 칸별 오류 목록 / EMAIL_DOMAIN_NOT_ALLOWED: @ 뒤가 hansung.ac.kr·hansung.kr·hansung.edu와 정확히 같지 않음(기획안 1장) / OTP_INVALID: 번호 불일치, 이미 사용, 다른 이메일 / OTP_EXPIRED: 5분 지남(기획안 1장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    message: 입력값을 확인해 주세요.
                    data: null
                    errorCode: VALIDATION_ERROR
                EMAIL_DOMAIN_NOT_ALLOWED:
                  value:
                    success: false
                    message: 학교 이메일만 사용할 수 있습니다.
                    data: null
                    errorCode: EMAIL_DOMAIN_NOT_ALLOWED
                OTP_INVALID:
                  value:
                    success: false
                    message: 인증 코드가 올바르지 않습니다.
                    data: null
                    errorCode: OTP_INVALID
                OTP_EXPIRED:
                  value:
                    success: false
                    message: 인증 코드가 만료되었습니다. 코드를 다시 받아 주세요.
                    data: null
                    errorCode: OTP_EXPIRED
        '409':
          description: 'EMAIL_ALREADY_USED: 가입·이메일 변경'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_ALREADY_USED:
                  value:
                    success: false
                    message: 이미 가입된 이메일입니다.
                    data: null
                    errorCode: EMAIL_ALREADY_USED
  /auth/login:
    post:
      tags:
      - 인증
      summary: 로그인
      operationId: postAuthLogin
      description: '학교 이메일과 비밀번호로 로그인한다. 5번 연속 틀리면 5분 동안 막는다(기획안 1장). 승인 전·반려·정지 학생도 로그인은 된다(조회는 가능, 기획안 1장).


        **담당:** 백엔드 1 · **권한:** 없음 · **이슈:** B1-04'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthTokens'
        '400':
          description: 'VALIDATION_ERROR: 필수값 누락, 형식 오류. data에 칸별 오류 목록'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    message: 입력값을 확인해 주세요.
                    data: null
                    errorCode: VALIDATION_ERROR
        '401':
          description: 'INVALID_CREDENTIALS: 로그인 실패'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  value:
                    success: false
                    message: 이메일과 비밀번호를 확인해 주세요.
                    data: null
                    errorCode: INVALID_CREDENTIALS
        '429':
          description: 'LOGIN_LOCKED: 5번 연속 실패(앱 기능)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                LOGIN_LOCKED:
                  value:
                    success: false
                    message: 5분 동안 로그인이 제한됩니다.
                    data: null
                    errorCode: LOGIN_LOCKED
  /auth/token/refresh:
    post:
      tags:
      - 인증
      summary: 토큰 새로 받기
      operationId: postAuthTokenRefresh
      description: '리프레시 토큰으로 새 액세스 토큰을 받는다(추천: 액세스 30분, 리프레시 14일). 저장된 리프레시 토큰과 맞지 않거나 로그아웃으로 지워진 토큰이면 UNAUTHORIZED.


        **담당:** 백엔드 1 · **권한:** 없음 · **이슈:** B1-04'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AuthTokens'
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
  /auth/logout:
    post:
      tags:
      - 인증
      summary: 로그아웃
      operationId: postAuthLogout
      description: '보낸 리프레시 토큰을 지워 다시 쓰지 못하게 하고, pushToken이 있으면 그 휴대폰의 푸시 토큰을 지운다. 로그아웃한 휴대폰으로 이전 사용자의 알림이 가지 않게 하기 위함이다. 액세스 토큰은 만료될 때까지 앱이 버린다.


        **담당:** 백엔드 1 · **권한:** 로그인한 사용자 · **이슈:** B1-04'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      nullable: true
                      example: null
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
  /auth/password/reset:
    post:
      tags:
      - 인증
      summary: 비밀번호 찾기
      operationId: postAuthPasswordReset
      description: 'PASSWORD_RESET 인증번호로 새 비밀번호를 정한다(정리 문서 "비밀번호 찾기는 이메일 인증").


        **담당:** 백엔드 1 · **권한:** 없음 · **이슈:** B1-05'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      nullable: true
                      example: null
        '400':
          description: 'VALIDATION_ERROR: 필수값 누락, 형식 오류. data에 칸별 오류 목록 / OTP_INVALID: 번호 불일치, 이미 사용, 다른 이메일 / OTP_EXPIRED: 5분 지남(기획안 1장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    message: 입력값을 확인해 주세요.
                    data: null
                    errorCode: VALIDATION_ERROR
                OTP_INVALID:
                  value:
                    success: false
                    message: 인증 코드가 올바르지 않습니다.
                    data: null
                    errorCode: OTP_INVALID
                OTP_EXPIRED:
                  value:
                    success: false
                    message: 인증 코드가 만료되었습니다. 코드를 다시 받아 주세요.
                    data: null
                    errorCode: OTP_EXPIRED
        '404':
          description: 'NOT_FOUND: 없는 id·코드'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NOT_FOUND:
                  value:
                    success: false
                    message: 대상을 찾을 수 없습니다.
                    data: null
                    errorCode: NOT_FOUND
  /users/me:
    get:
      tags:
      - 내 정보
      summary: 내 정보
      operationId: getUsersMe
      description: '승인 상태, 반려 사유, 유효 경고 수, 정지 상태를 준다. 앱은 열 때 반려 사유를 보여 준다(기획안 1장).


        **담당:** 백엔드 1 · **권한:** 로그인한 사용자 · **이슈:** B1-06'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Me'
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
    delete:
      tags:
      - 내 정보
      summary: 탈퇴
      operationId: deleteUsersMe
      description: '대여 중이면 거부. 수령 전 예약은 취소하고 계정과 대여 기록을 지운다. 학생에게 예약을 먼저 취소하라고 요구하지 않는다. 경고는 학번과 함께 6개월 보관(기획안 1장, DB 설계 4절).


        **담당:** 백엔드 1 · **권한:** 학생 · **이슈:** B1-09


        **상태 변화:** RESERVED → CANCELLED(회원 탈퇴) (기준: docs/db/README.md 7절)'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      nullable: true
                      example: null
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
        '409':
          description: 'WITHDRAW_BLOCKED_HELD: 대여 중 탈퇴(기획안 1장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                WITHDRAW_BLOCKED_HELD:
                  value:
                    success: false
                    message: 보유 중인 기기를 먼저 반납해 주세요.
                    data: null
                    errorCode: WITHDRAW_BLOCKED_HELD
  /users/me/student-id:
    post:
      tags:
      - 내 정보
      summary: 학생증 제출·재제출
      operationId: postUsersMeStudentId
      description: '이름, 학번, 학생증 사진을 제출해 approval을 PENDING으로 바꾼다. 반려된 학생은 횟수 제한 없이 다시 낸다(기획안 1장). 같은 학번으로 탈퇴 보관 경고가 있으면 승인할 때 되살린다(DB 설계 3절).


        **담당:** 백엔드 1 · **권한:** 학생 · **이슈:** B1-07


        **상태 변화:** approval NONE·REJECTED → PENDING (기준: docs/db/README.md 7절)'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StudentIdSubmit'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Me'
        '400':
          description: 'VALIDATION_ERROR: 필수값 누락, 형식 오류. data에 칸별 오류 목록 / FILE_INVALID: 형식·크기'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_ERROR:
                  value:
                    success: false
                    message: 입력값을 확인해 주세요.
                    data: null
                    errorCode: VALIDATION_ERROR
                FILE_INVALID:
                  value:
                    success: false
                    message: jpg 또는 png 사진을 올려 주세요.
                    data: null
                    errorCode: FILE_INVALID
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
        '409':
          description: 'STUDENT_NUMBER_DUPLICATE: 같은 학번 두 계정 금지(기획안 1장) / APPROVAL_NOT_PENDING: 이미 승인·반려한 학생을 다시 처리'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STUDENT_NUMBER_DUPLICATE:
                  value:
                    success: false
                    message: 이미 등록된 학번입니다.
                    data: null
                    errorCode: STUDENT_NUMBER_DUPLICATE
                APPROVAL_NOT_PENDING:
                  value:
                    success: false
                    message: 승인 대기 중인 계정이 아닙니다.
                    data: null
                    errorCode: APPROVAL_NOT_PENDING
        '503':
          description: 'STORAGE_UNAVAILABLE: S3 실패(docs/외부연결.md)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STORAGE_UNAVAILABLE:
                  value:
                    success: false
                    message: 사진을 저장하지 못했습니다. 잠시 뒤 다시 시도해 주세요.
                    data: null
                    errorCode: STORAGE_UNAVAILABLE
