  /admin/rentals/{id}/return:
    post:
      tags:
      - 관리자 대여
      summary: 반납 처리
      operationId: postAdminRentalsIdReturn
      description: '정상·파손을 고르고 승인한다. 승인 시각이 반납 시각이고 연체 기준이다(기획안 6장). 늦으면 연체 경고, 신고 없는 파손은 파손 경고(기획안 7장).


        **담당:** 백엔드 2 · **권한:** 관리자 · **이슈:** B2-08


        **상태 변화:** RENTING → RETURNED (기준: docs/db/README.md 7절)


        기기를 DAMAGED로 처리할 때 같은 트랜잭션에서 B2-16 예약 정리 서비스를 호출한다. 현재 정상 기기 수로 다시 계산해 다른 기기로 충당할 수 없는 예약만 늦게 신청한 순서로 즉시 취소하고 해당 예약자에게 알린다. 이미 INSPECTION인 기기를 다시 수량 감소로 차감하지 않는다.


        미처리된 예약 시작 판정은 시작 시점 기준으로 먼저 처리한다. 시작 시 내줄 정상 기기가 없으면 해당 예약은 즉시 CANCELLED, CANCEL 알림, 학생 경고 없음이다. 이후 반납으로 취소 예약을 복원하거나 수령 안내를 보내지 않는다. 취소 예약 수령은 INVALID_STATUS이다.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 대상 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReturnRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AdminRental'
        '400':
          description: 'UNIT_MISMATCH: 다른 모델, 정상 아님(기획안 5장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNIT_MISMATCH:
                  value:
                    success: false
                    message: 예약한 모델의 정상 기기인지 확인해 주세요.
                    data: null
                    errorCode: UNIT_MISMATCH
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
        '409':
          description: 'INVALID_STATUS: 수령·반납·정정을 맞지 않는 상태에서 요청 / CONFLICT_RETRY: 같은 기록을 동시에 고쳐 @Version 충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_STATUS:
                  value:
                    success: false
                    message: 지금 상태에서는 처리할 수 없습니다.
                    data: null
                    errorCode: INVALID_STATUS
                CONFLICT_RETRY:
                  value:
                    success: false
                    message: 다른 요청과 겹쳤습니다. 다시 시도해 주세요.
                    data: null
                    errorCode: CONFLICT_RETRY
