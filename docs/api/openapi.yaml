      tags:
      - 통계·기록
      summary: 관리 기록
      operationId: getAdminAuditLogs
      description: '수령, 현장 대여, 반납, 정정, 경고 취소, 기기·모델·운영 변경, 탈퇴(기획안 11장).


        **담당:** 백엔드 1 · **권한:** 관리자 · **이슈:** B1-24


        from과 to는 둘 다 생략하거나 함께 보낸다. 기간은 createdAt 기준 한국 날짜 양끝 포함. 기간·종류 조건을 모두 적용한 뒤 최신순 페이지 처리한다. 날짜 형식 오류, from > to, 한쪽 날짜만 전송, action/actions 동시 지정은 VALIDATION_ERROR.'
      parameters:
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: 종류
      - *id001
      - *id002
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 시작일(한국 날짜, 포함)
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: 종료일(한국 날짜, 포함)
      - name: actions
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        description: "종류 여러 개를 OR로 조회. 예: PICKUP,WALK_IN. action과 동시 사용 불가. 화면의 종류 묶음 매핑은 API README 참조."
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '#/components/schemas/AuditLog'
                        page:
                          $ref: '#/components/schemas/PageMeta'
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
        "400":
          description: "VALIDATION_ERROR: 필수값·날짜 형식·조회 범위·필터 조합 오류"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                message: 입력값을 확인해 주세요.
                data: null
                errorCode: VALIDATION_ERROR
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: 요청을 처리했습니다.
        data:
          description: API마다 다른 본문. 없으면 null
          nullable: true
        errorCode:
          type: string
          description: 오류일 때만 값이 있음. docs/api/README.md 오류 코드 표
          nullable: true
      required:
      - success
      - message
      - data
      - errorCode
      description: 모든 응답의 공통 틀(옛 README에서 확정)
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 같은 종류의 진행 중인 신청은 하나만 가능합니다.
        data:
          nullable: true
          example: null
          description: 입력 검증 오류면 칸별 오류 목록
        errorCode:
          type: string
          example: SAME_KIND_ACTIVE
      required:
      - success
      - message
      - data
      - errorCode
    FieldError:
      type: object
      properties:
        field:
          type: string
          example: email
        reason:
          type: string
          example: 학교 이메일만 가입할 수 있습니다.
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          format: int64
          example: 0
        size:
          type: integer
          format: int64
          example: 20
        totalElements:
          type: integer
          format: int64
          example: 57
        totalPages:
          type: integer
          format: int64
          example: 3
      description: 목록 끝에 붙는 쪽 정보(추천)
    Suspension:
      type: object
      properties:
        suspended:
          type: boolean
          example: false
        until:
          type: string
          format: date-time
          description: 정지 종료 시각
          example: '2026-10-07T10:00:00+09:00'
          nullable: true
        untilReturn:
          type: boolean
          description: 보유 기기를 반납해야 6개월이 시작되는 상태
          example: false
    Me:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        role:
          type: string
          enum:
          - STUDENT
          - ADMIN
          example: STUDENT
        email:
          type: string
          format: email
          example: demo@hansung.ac.kr
        name:
          type: string
          example: 김하늘
          nullable: true
        studentNumber:
          type: string
          example: '2499001'
          nullable: true
        approval:
          type: string
          enum: *id003
          example: APPROVED
        rejectReason:
          type: string
          nullable: true
        profileImageUrl:
          type: string
          description: S3 임시 주소(유효 시간 있음)
          nullable: true
        activeWarningCount:
          type: integer
          format: int64
          example: 1
        suspension:
          $ref: '#/components/schemas/Suspension'
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOi...
        refreshToken:
          type: string
          example: eyJhbGciOi...
        accessTokenExpiresIn:
          type: integer
          format: int64
          description: 초 단위(추천 1800)
          example: 1800
        user:
          $ref: '#/components/schemas/Me'
    EmailCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: newstudent@hansung.ac.kr
        purpose:
          type: string
          enum:
          - SIGNUP
          - PASSWORD_RESET
          - EMAIL_CHANGE
          example: SIGNUP
      required:
      - email
      - purpose
    EmailCodeSent:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
          description: 인증번호 만료 시각(보낸 뒤 5분)
          example: '2026-10-07T10:00:00+09:00'
    SignupRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: newstudent@hansung.ac.kr
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: '483920'
        password:
          type: string
          maxLength: 64
          minLength: 8
          description: 8자 이상(추천)
          example: safePass123
      required:
      - email
      - code
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: demo@hansung.ac.kr
        password:
          type: string
          example: demo1234
      required:
      - email
      - password
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOi...
      required:
      - refreshToken
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          example: eyJhbGciOi...
        pushToken:
          type: string
          description: 이 휴대폰의 FCM 토큰. 있으면 지운다
          example: fcm-token-abc
          nullable: true
      required:
      - refreshToken
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: demo@hansung.ac.kr
        code:
          type: string
          pattern: ^[0-9]{6}$
          example: '483920'
        newPassword:
          type: string
          maxLength: 64
          minLength: 8
          example: newPass1234
      required:
      - email
      - code
      - newPassword
    PasswordChangeRequest:
      type: object
      properties:
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: 현재 이메일로 받은 인증번호(PASSWORD_RESET 목적)
          example: '483920'
        newPassword:
          type: string
          maxLength: 64
          minLength: 8
          example: newPass1234
      required:
      - code
      - newPassword
    EmailChangeRequest:
      type: object
      properties:
        newEmail:
          type: string
          format: email
          example: kim.haneul@hansung.kr
        code:
          type: string
          pattern: ^[0-9]{6}$
          description: 새 이메일로 받은 인증번호(EMAIL_CHANGE 목적)
          example: '483920'
      required:
      - newEmail
      - code
    StudentIdSubmit:
      type: object
      properties:
        name:
          type: string
          maxLength: 30
          example: 김하늘
        studentNumber:
          type: string
          pattern: ^[0-9]{7,10}$
          example: '2499001'
        image:
