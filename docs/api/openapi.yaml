  /reservations:
    post:
      tags:
      - 대여
      summary: 예약하기
      operationId: postReservations
      description: '고른 칸을 한 번의 신청으로 저장한다. 떨어진 칸은 각각 한 행이 되고 같은 applicationId로 묶인다(기획안 3장). 모델 행을 잠그고 대수를 다시 센다(DB 설계 6절).


        **담당:** 백엔드 2 · **권한:** 학생 · **이슈:** B2-03


        **상태 변화:** (없음) → RESERVED (기준: docs/db/README.md 7절)


        일반·2일 이상은 segments, 장기는 pickupDate 형식을 사용한다. 장기의 시작 시각·반납 기한은 서버가 계산한다. 장기 수령일 선택에는 일반 시간 칸의 시작 시각 제한을 적용하지 않으며 오늘 운영 종료부터 OUT_OF_BOOKING_WINDOW이다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
      responses:
        '201':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/ReservationResult'
        '400':
          description: 'SEGMENT_INVALID: 시작 ≥ 종료, 칸 없음 / SEGMENTS_OVERLAP: 예약 구간이 서로 겹칩니다. / OUT_OF_BOOKING_WINDOW: 이미 시작한 칸, 다음 주 금요일 이후(장기는 1년 이후, maxRentalDays가 있으면 시작일 + 그 일수 이후)(기획안 3·4장) / CLOSED_DAY: 주말·공휴일·임시 휴무에 시작(기획안 8장) / RETURN_ON_CLOSED_DAY: 2일 이상 대여(기획안 8장) / SLOT_INVALID: 칸 경계와 맞지 않음, 운영 시간 밖 / SAME_DAY_ONLY: 2일 이상 대여가 아닌 모델 / LONG_TERM_DATE_INVALID: 기획안 4장 / RENTAL_TOO_LONG: 품목의 한 번 대여 최대 시간(maxRentalMinutes)을 넘음(기획안 3장) / VALIDATION_ERROR: 요청 형식과 모델 대여 유형 불일치 또는 날짜·시간 칸 혼합'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                SEGMENT_INVALID:
                  value:
                    success: false
                    message: 시작과 종료 시간을 확인해 주세요.
                    data: null
                    errorCode: SEGMENT_INVALID
                RENTAL_TOO_LONG:
                  value:
                    success: false
                    message: 이 기자재는 한 번에 빌릴 수 있는 시간을 넘었습니다.
                    data: null
                    errorCode: RENTAL_TOO_LONG
                SEGMENTS_OVERLAP:
                  value:
                    success: false
                    message: 예약 구간이 서로 겹칩니다.
                    data: null
                    errorCode: SEGMENTS_OVERLAP
                OUT_OF_BOOKING_WINDOW:
                  value:
                    success: false
                    message: 예약 가능 기간을 확인해 주세요.
                    data: null
                    errorCode: OUT_OF_BOOKING_WINDOW
                CLOSED_DAY:
                  value:
                    success: false
                    message: 운영하지 않는 날입니다.
                    data: null
                    errorCode: CLOSED_DAY
                RETURN_ON_CLOSED_DAY:
                  value:
                    success: false
                    message: 반납일이 휴무일입니다. 다른 날을 선택해 주세요.
                    data: null
                    errorCode: RETURN_ON_CLOSED_DAY
                SLOT_INVALID:
                  value:
                    success: false
                    message: 운영 시간 안의 시간 칸을 선택해 주세요.
                    data: null
                    errorCode: SLOT_INVALID
                SAME_DAY_ONLY:
                  value:
                    success: false
                    message: 이 모델은 당일 대여만 가능합니다.
                    data: null
                    errorCode: SAME_DAY_ONLY
                LONG_TERM_DATE_INVALID:
                  value:
                    success: false
                    message: 장기 대여는 수령일만 고르고 반납은 6개월 뒤 운영일까지입니다.
                    data: null
                    errorCode: LONG_TERM_DATE_INVALID
                VALIDATION_ERROR:
                  value:
                    success: false
                    message: 입력값을 확인해 주세요.
                    data: null
                    errorCode: VALIDATION_ERROR
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근 / NOT_APPROVED: 승인 전 예약·대여(기획안 1장) / SUSPENDED: 정지 중 예약·현장 대여·연장(기획안 7장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
                NOT_APPROVED:
                  value:
                    success: false
                    message: 승인된 학생 계정에서 예약할 수 있습니다.
                    data: null
                    errorCode: NOT_APPROVED
                SUSPENDED:
                  value:
                    success: false
                    message: 이용 정지 중입니다.
                    data: null
                    errorCode: SUSPENDED
        '409':
          description: 'LATE_RENTAL_EXISTS: 연체 중 새 예약·현장 대여(기획안 3·5장) / SAME_KIND_ACTIVE: 같은 모델 또는 같은 이름 모델에 진행 중 신청(기획안 3장) / MODEL_ARCHIVED: 운영이 종료된 모델입니다. / NO_CAPACITY: 대여 가능 대수 0(1시간 여유 포함)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                LATE_RENTAL_EXISTS:
                  value:
                    success: false
                    message: 연체 중인 기자재를 먼저 반납해 주세요.
                    data: null
                    errorCode: LATE_RENTAL_EXISTS
                SAME_KIND_ACTIVE:
                  value:
                    success: false
                    message: 같은 종류의 진행 중인 신청은 하나만 가능합니다.
                    data: null
                    errorCode: SAME_KIND_ACTIVE
                MODEL_ARCHIVED:
                  value:
                    success: false
                    message: 운영이 종료된 모델입니다.
                    data: null
                    errorCode: MODEL_ARCHIVED
                NO_CAPACITY:
                  value:
                    success: false
                    message: 선택한 시간의 남은 수량이 없습니다.
                    data: null
                    errorCode: NO_CAPACITY
