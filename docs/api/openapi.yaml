  /admin/rentals/{id}/pickup:
    post:
      tags:
      - 관리자 대여
      summary: 수령 처리
      operationId: postAdminRentalsIdPickup
      description: '건네줄 기기 코드를 찍고 승인하면 대여가 시작된다(기획안 5장). 모델 행을 잠근다. 수령 마감(일반·2일 이상은 예약 시작 + 10분, 장기는 수령일 운영 종료 시각)이 지났으면 판정 작업을 기다리지 않고 이 요청에서 노쇼로 처리한 뒤 NO_SHOW_DEADLINE_PASSED로 거절한다.


        **담당:** 백엔드 2 · **권한:** 관리자 · **이슈:** B2-06


        **상태 변화:** RESERVED → RENTING (기준: docs/db/README.md 7절)


        아직 수령 전인 예약의 노쇼 마감 도달 검사를 운영 시간 거절보다 먼저 한다. 장기 수령일 운영 종료 시각에는 OUTSIDE_OPERATING_HOURS만 반환하고 노쇼 처리를 누락하지 않는다.


        미처리된 예약 시작 판정은 시작 시점 기준으로 먼저 처리한다. 시작 시 내줄 정상 기기가 없으면 해당 예약은 즉시 CANCELLED, CANCEL 알림, 학생 경고 없음이다. 이후 반납으로 취소 예약을 복원하거나 수령 안내를 보내지 않는다. 취소 예약 수령은 INVALID_STATUS이다.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 대상 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PickupRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/AdminRental'
        '400':
          description: 'PROFESSOR_MAIL_REQUIRED: 장기 대여 수령(기획안 4장) / UNIT_MISMATCH: 다른 모델, 정상 아님(기획안 5장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                PROFESSOR_MAIL_REQUIRED:
                  value:
                    success: false
                    message: 지도교수 승인 메일을 현장에서 확인해 주세요.
                    data: null
                    errorCode: PROFESSOR_MAIL_REQUIRED
                UNIT_MISMATCH:
                  value:
                    success: false
                    message: 예약한 모델의 정상 기기인지 확인해 주세요.
                    data: null
                    errorCode: UNIT_MISMATCH
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근 / NOT_APPROVED: 승인 전 예약·대여(기획안 1장) / SUSPENDED: 정지 중 예약·현장 대여·연장(기획안 7장)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
                NOT_APPROVED:
                  value:
                    success: false
                    message: 승인된 학생 계정에서 예약할 수 있습니다.
                    data: null
                    errorCode: NOT_APPROVED
                SUSPENDED:
                  value:
                    success: false
                    message: 이용 정지 중입니다.
                    data: null
                    errorCode: SUSPENDED
        '409':
          description: 'NO_SHOW_DEADLINE_PASSED: 일반·2일 이상 예약 시작 10분, 장기 수령일 운영 종료이 지난 뒤 수령 요청. 판정 작업이 아직 돌지 않았어도 이 요청에서 노쇼로 처리하고 거절(DB 설계 7절) / INVALID_STATUS: 수령·반납·정정을 맞지 않는 상태에서 요청 / OUTSIDE_OPERATING_HOURS: 운영 시간 밖 수령·현장 대여(기획안 5장) / UNIT_IN_USE: 이미 대여 중인 기기입니다. / NO_EARLY_CAPACITY: 시작 전 수령인데 그 사이 남는 기기 없음(기획안 5장) / RESERVATION_ENDED: 예약 시간이 종료되었습니다. / CONFLICT_RETRY: 같은 기록을 동시에 고쳐 @Version 충돌'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                NO_SHOW_DEADLINE_PASSED:
                  value:
                    success: false
                    message: 수령 마감이 지나 노쇼로 처리되었습니다.
                    data: null
                    errorCode: NO_SHOW_DEADLINE_PASSED
                INVALID_STATUS:
                  value:
                    success: false
                    message: 지금 상태에서는 처리할 수 없습니다.
                    data: null
                    errorCode: INVALID_STATUS
                OUTSIDE_OPERATING_HOURS:
                  value:
                    success: false
                    message: 운영 시간에만 처리할 수 있습니다.
                    data: null
                    errorCode: OUTSIDE_OPERATING_HOURS
                UNIT_IN_USE:
                  value:
                    success: false
                    message: 이미 대여 중인 기기입니다.
                    data: null
                    errorCode: UNIT_IN_USE
                NO_EARLY_CAPACITY:
                  value:
                    success: false
                    message: 조기 수령 가능한 수량이 없습니다.
                    data: null
                    errorCode: NO_EARLY_CAPACITY
                RESERVATION_ENDED:
                  value:
                    success: false
                    message: 예약 시간이 종료되었습니다.
                    data: null
                    errorCode: RESERVATION_ENDED
                CONFLICT_RETRY:
                  value:
                    success: false
                    message: 다른 요청과 겹쳤습니다. 다시 시도해 주세요.
                    data: null
                    errorCode: CONFLICT_RETRY
