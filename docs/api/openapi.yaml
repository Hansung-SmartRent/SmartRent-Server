  /rentals/{id}/damage-report:
    post:
      tags:
      - 대여
      summary: 기기 이상 신고
      operationId: postRentalsIdDamageReport
      description: '대여 중인 기기만. 기기는 INSPECTION이 되고 대여는 RENTING 그대로(반납 기한 같음). 관리자 상태 변경과 똑같이 대수를 다시 세어 다른 정상 기기로 줄 수 없는 예약만 늦게 예약한 순서로 바로 취소하고 알린다(경고 없음, 기획안 2장, 백엔드 2 서비스). 스스로 신고하면 반납 때 파손이어도 경고 없음(기획안 7장). 관리자에게 알림.


        **담당:** 백엔드 1 · **권한:** 학생 · **이슈:** B1-13


        **상태 변화:** 기기 NORMAL → INSPECTION (기준: docs/db/README.md 7절)


        학생 응답에는 신고자 본인의 Rental만 넣는다. 다른 학생의 이름·예약 id·취소 목록은 반환하지 않는다. 예약 정리 결과는 내부 처리와 해당 예약자 알림에만 사용한다.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: 대상 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DamageReport'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ApiResponse'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Rental'
        '401':
          description: 'UNAUTHORIZED: 토큰 없음·만료·위조'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHORIZED:
                  value:
                    success: false
                    message: 로그인이 필요합니다.
                    data: null
                    errorCode: UNAUTHORIZED
        '403':
          description: 'FORBIDDEN: 학생이 관리자 API 호출, 남의 대여에 접근'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                FORBIDDEN:
                  value:
                    success: false
                    message: 권한이 없습니다.
                    data: null
                    errorCode: FORBIDDEN
        '409':
          description: 'INVALID_STATUS: 수령·반납·정정을 맞지 않는 상태에서 요청'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_STATUS:
                  value:
                    success: false
                    message: 지금 상태에서는 처리할 수 없습니다.
                    data: null
                    errorCode: INVALID_STATUS
