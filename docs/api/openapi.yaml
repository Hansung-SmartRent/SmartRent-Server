                format: int64
              modelName:
                type: string
              rentalCount:
                type: integer
                description: 해당 기간 모델의 실제 수령 대여 기록 수
                format: int64
                minimum: 0
                example: 0
      description: 기간 집계와 현재 전체 현황을 구분. 집계 의미는 API README 통계 추천안(C-03 확인 전 구현 보류).
      required:
      - period
      - counts
      - topModels
